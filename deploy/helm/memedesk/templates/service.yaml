# TEMPLATE — not applied or validated against a live environment.
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.expose (gt (int $svc.port) 0) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    memedesk/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    memedesk/component: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
{{- end }}
{{- end }}

{{- /* Signer isolation: only pods of the submission service may reach the signer.
       NetworkPolicy needs a CNI that enforces it; verify in your cluster. */}}
{{- if and .Values.services.signer.enabled .Values.services.signer.networkIsolated }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-signer-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      memedesk/component: signer
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              memedesk/component: {{ .Values.submissionService }}
      ports:
        - protocol: TCP
          port: {{ .Values.services.signer.port }}
{{- end }}
