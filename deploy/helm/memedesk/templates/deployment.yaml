# TEMPLATE — not applied or validated against a live environment.
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    app.kubernetes.io/name: memedesk
    app.kubernetes.io/instance: {{ $.Release.Name }}
    memedesk/component: {{ $name }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      memedesk/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memedesk
        app.kubernetes.io/instance: {{ $.Release.Name }}
        memedesk/component: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}:{{ required "image.tag is required" $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: {{ toJson $svc.command }}
          {{- if gt (int $svc.port) 0 }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          {{- end }}
          env:
            - name: SERVICE_NAME
              value: {{ $name | quote }}
            {{- range $k, $v := $.Values.commonEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretRefs.database }}
                  key: url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretRefs.redis }}
                  key: url
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
{{- end }}
{{- end }}
