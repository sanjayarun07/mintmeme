# TEMPLATE — not applied or validated against a live environment.
# Image repository/tag are placeholders: set your own (prefer digest pins).
# No secrets live here; reference pre-existing Kubernetes Secrets by name.
image:
  repository: REPLACE_ME/memedesk
  tag: ""            # REQUIRED: set at deploy time
  pullPolicy: IfNotPresent

commonEnv: {}        # non-secret env, e.g. LOG_LEVEL: info
secretRefs:          # existing Secret names (created out-of-band)
  database: memedesk-database
  redis: memedesk-redis

# Service whose pods are the only allowed ingress to the signer.
submissionService: reconciler   # key in `services` below; change if submission lives elsewhere

services:
  api:
    enabled: true
    replicas: 2
    command: ["node", "--experimental-transform-types", "--no-warnings", "apps/api/server.ts"]
    port: 3000
    expose: true
  strategy:
    enabled: true
    replicas: 1
    command: ["node", "--experimental-transform-types", "--no-warnings", "apps/strategy/main.ts"]
    port: 0
  listeners:
    enabled: true
    replicas: 1
    command: ["node", "--experimental-transform-types", "--no-warnings", "apps/listeners/main.ts"]
    port: 0
  signer:
    enabled: true
    replicas: 1
    command: ["node", "--experimental-transform-types", "--no-warnings", "apps/signer/server.ts"]
    port: 8443
    expose: true          # ClusterIP only; guarded by NetworkPolicy
    networkIsolated: true
  reconciler:
    enabled: true
    replicas: 1           # keep single-writer unless leader election exists
    command: ["node", "--experimental-transform-types", "--no-warnings", "apps/reconciler/main.ts"]
    port: 0
  notifier:
    enabled: true
    replicas: 1
    command: ["node", "--experimental-transform-types", "--no-warnings", "apps/notifier/main.ts"]
    port: 0
  billing:
    enabled: true
    replicas: 1
    command: ["node", "--experimental-transform-types", "--no-warnings", "apps/billing/main.ts"]
    port: 0

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 512Mi }
