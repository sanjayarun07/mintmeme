# Load balancer in front of the execution nodes. Any node can take any request (it forwards to the user's owner node), so plain round robin is fine.
# Production: listen 443 ssl here (or on your cloud load balancer) with your certificate; API keys are bearer secrets and must never cross the internet in plain HTTP.
upstream memedesk_nodes {
  server node1:3500 max_fails=2 fail_timeout=5s;
  server node2:3500 max_fails=2 fail_timeout=5s;
  server node3:3500 max_fails=2 fail_timeout=5s;
  keepalive 32;
}
server {
  listen 8080;
  client_max_body_size 256k;
  location = /metrics { return 404; }   # scrape each node directly on the private network, not through the public entry
  location / {
    proxy_pass http://memedesk_nodes;
    proxy_connect_timeout 2s;             # a stopped container does not refuse connections, it just never answers: fail over fast instead of nginx's 60 s default
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;                  # /v1/events is a server-sent event stream
    proxy_read_timeout 1h;
    proxy_next_upstream error timeout http_502;   # never retry a 503 or a POST that may have been processed
  }
}
