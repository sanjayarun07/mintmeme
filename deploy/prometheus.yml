# TEMPLATE — not applied or validated against a live environment.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
  - job_name: web
    # TODO: assumes web exposes /metrics; adjust to the real app.
    static_configs: [{ targets: ["web:3000"] }]
