# TEMPLATE — not applied or validated against a live environment.
# Local dev stack only. All secrets are placeholders: set real values in your
# shell/.env and replace CHANGE_ME. Image tags are floating major tags for dev;
# pin by digest yourself for anything beyond local dev.
name: memedesk-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memedesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-memedesk}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    volumes: [redpanda:/var/lib/redpanda/data]

  clickhouse:
    image: clickhouse/clickhouse-server:24
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-memedesk}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-CHANGE_ME}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-memedesk}
    ports: ["8123:8123", "9000:9000"]
    volumes: [clickhouse:/var/lib/clickhouse]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME}
    ports: ["3001:3000"]
    volumes: [grafana:/var/lib/grafana]
    depends_on: [prometheus]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4317:4317", "4318:4318", "8889:8889"]

  web:
    image: node:22
    working_dir: /repo
    command: ["node", "--experimental-transform-types", "--no-warnings", "apps/web/server.ts"]
    volumes:
      - ./:/repo
    environment:
      PORT: ${WEB_PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-memedesk}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-memedesk}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      CLICKHOUSE_URL: http://clickhouse:8123
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Signer is reached via key_ref only; never place private keys here.
      SIGNER_URL: ${SIGNER_URL:-http://signer.invalid}
    ports: ["${WEB_PORT:-3000}:${WEB_PORT:-3000}"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  redpanda:
  clickhouse:
  grafana:
